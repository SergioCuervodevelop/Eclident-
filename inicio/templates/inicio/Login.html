{% extends "inicio/base.html" %}
{% load static %}

{% block title %}Acceso - Eclident{% endblock %}

{% block extra_head %}
<link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
<style>
    .login-card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .nav-pills .nav-link { color: #6c757d; font-weight: bold; border-radius: 50px; padding: 10px 25px; }
    .nav-pills .nav-link.active { background: linear-gradient(135deg, #008ed6 0%, #0311d1 100%); color: white; }
    .input-group-text { background: none; border-right: none; color: #008ed6; }
    .form-control { border-left: none; }
    .form-control:focus { box-shadow: none; border-color: #dee2e6; }
    .btn-google { background: white; border: 1px solid #dadce0; color: #3c4043; font-weight: bold; }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            
            <div class="text-center mb-4">
                <img src="{% static 'inicio/Logoeclident.png' %}" alt="Logo" style="max-width: 160px;">
            </div>

            {% if mensaje %}
            <div class="alert {% if tipo_mensaje == 'success' %}alert-success{% else %}alert-danger{% endif %} rounded-4 border-0 shadow-sm mb-4">
                <i class="fa {% if tipo_mensaje == 'success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %} me-2"></i>
                {{ mensaje }}
            </div>
            {% endif %}

            <div class="card login-card p-4">
                <ul class="nav nav-pills nav-justified mb-4" id="pills-tab">
                    <li class="nav-item">
                        <button class="nav-link active" id="tab-login" data-bs-toggle="pill" data-bs-target="#content-login">Entrar</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="tab-registro" data-bs-toggle="pill" data-bs-target="#content-registro">Registrarme</button>
                    </li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane fade show active" id="content-login">
                        <form method="POST">
                            {% csrf_token %}
                            <input type="hidden" name="accion" value="login">
                            <div class="mb-3 input-group">
                                <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="Email" required>
                            </div>
                            <div class="mb-3 input-group">
                                <span class="input-group-text"><i class="fa fa-lock fs-5"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2 shadow-sm" style="background: linear-gradient(135deg, #008ed6 0%, #0311d1 100%); border: none;">
                                Iniciar Sesión
                            </button>
                        </form>
                    </div>

                    <div class="tab-pane fade" id="content-registro">
                        <form method="POST">
                            {% csrf_token %}
                            <input type="hidden" name="accion" value="registro">
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <input type="text" name="firstname" class="form-control rounded-3" placeholder="Nombre" required>
                                </div>
                                <div class="col-6 mb-3">
                                    <input type="text" name="lastname" class="form-control rounded-3" placeholder="Apellido" required>
                                </div>
                            </div>
                            <div class="mb-3 input-group">
                                <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="Email para tu cuenta" required>
                            </div>
                            <div class="mb-3 input-group">
                                <span class="input-group-text"><i class="fa fa-lock fs-5"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Crea tu contraseña" required minlength="8">
                            </div>
                            <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold py-2 shadow-sm" style="background: linear-gradient(135deg, #008ed6 0%, #0311d1 100%); border: none;">
                                Crear mi Cuenta
                            </button>
                        </form>
                    </div>
                </div>

                <div class="text-center my-4 text-muted small fw-bold">O CONTINÚA CON</div>

                <a href="{% url 'google_login_custom' %}" class="btn btn-google w-100 rounded-pill py-2 d-flex align-items-center justify-content-center shadow-sm">
                    <i class="fa fa-google me-2" style="color: #392ce7; font-size: 1.2rem;"></i> Google
               </a>

                <div class="mt-4 text-center">
                    <a href="{% url 'recuperar_contrasena' %}" class="text-decoration-none small fw-bold text-primary">¿Olvidaste tu contraseña?</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const mensaje = "{{ mensaje|default:'' }}";
        if (mensaje.includes("Ya existe") || mensaje.includes("Error")) {
            const regTab = new bootstrap.Tab(document.querySelector('#tab-registro'));
            regTab.show();
        }
    });
</script>
{% endblock %}
