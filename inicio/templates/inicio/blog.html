<!DOCTYPE html>
<html>
<head>
    <title>Blog Eclident</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .card h2 {
            margin: 0;
            font-size: 20px;
            color: #333;
        }

        .fecha {
            font-size: 12px;
            color: gray;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            color: #555;
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background: #0d6efd;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-size: 13px;
        }

        .btn:hover {
            background: #084298;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>🦷 Blog Eclident</h1>
    <p>Consejos, tratamientos y salud dental</p>
</div>

<div class="container">
    <div class="grid">

        {% for post in posts %}
        <div class="card">

            {% if post.imagen %}
                <img src="{{ post.imagen.url }}" alt="Imagen del post">
            {% else %}
                <img src="https://via.placeholder.com/400x200" alt="Imagen">
            {% endif %}

            <div class="card-content">
                <h2>{{ post.titulo }}</h2>
                <p class="fecha">{{ post.fecha }}</p>
                <p>{{ post.contenido|truncatewords:20 }}</p>

                <a href="/blog/{{ post.id }}/" class="btn">Leer más</a>
            </div>

        </div>
        {% endfor %}

    </div>

    <div style="text-align: center; margin-top: 40px;">
        <a href="/" class="btn">
            ← Volver al inicio
        </a>
    </div>
</div>

</body>
</html>
